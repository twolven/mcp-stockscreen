[project]
name = "mcp-stockscreen"
version = "2.1.0"
description = "MCP server for stock screening with Yahoo Finance"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.6",
    "yfinance>=1.2.0",
    "pydantic>=2.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "lxml>=4.9",
    "cssselect>=1.2",
    "requests>=2.31",
]

[project.scripts]
stockscreen = "stockscreen.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stockscreen"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
