name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix: {os: [ubuntu-latest, windows-latest], python: ['3.12', '3.13', '3.14']}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: '${{ matrix.python }}'}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv build
