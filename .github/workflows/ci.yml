name: CI
on: [pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix: {os: [ubuntu-latest, windows-latest], python: ['3.12', '3.13', '3.14']}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: '${{ matrix.python }}'}
      - run: uv sync --locked
      - run: uv lock --check
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest
      - run: uv build
      - run: uv run python scripts/verify_wheel.py
